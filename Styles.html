<style>
  :root { color-scheme: light; --navy: #102f3a; --teal: #0c6967; --ink: #17343d; --muted: #536c74; --line: #d8e4e6; --paper: #f4f8f8; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--paper); font: 15px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid #d18a28; outline-offset: 4px; }
  .skip-link { position: absolute; top: -80px; left: 16px; z-index: 5; padding: 12px; background: white; color: var(--ink); }
  .skip-link:focus { top: 12px; }
  .app-shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
  .sidebar { padding: 32px 20px 24px; background: var(--navy); color: #fff; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 0 9px; font-size: 25px; font-weight: 760; letter-spacing: 2px; }
  .brand small { display: block; font-size: 12px; font-weight: 400; letter-spacing: .6px; color: #b9d2d7; }
  .brand-symbol { display: grid; place-items: center; width: 44px; height: 48px; border: 1px solid #5a9299; border-radius: 15px 4px 15px 4px; color: #8de1d4; font: 30px Georgia, serif; }
  .nav-label { margin: 46px 12px 12px; font-size: 10px; letter-spacing: 1.7px; color: #b9d2d7; }
  nav { display: grid; gap: 7px; }
  .nav-button { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; border-radius: 8px; padding: 12px; background: transparent; color: #d7e5e8; font-size: 13px; }
  .nav-button:hover { background: #1b414d; }
  .nav-button[aria-current="page"] { background: #24515a; color: #fff; }
  .nav-number { width: 20px; font-size: 10px; color: #9cc1c7; }
  .sidebar-footer { margin: auto 10px 0; padding-top: 50px; font-size: 11px; color: #d7e5e8; }
  .sidebar-footer small { display: block; padding-left: 17px; color: #b9d2d7; }
  .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #7ecfc0; margin-right: 10px; }
  .workspace { display: flex; flex-direction: column; min-width: 0; }
  .topbar { min-height: 78px; padding: 20px 42px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); background: #fff; font-size: 12px; color: var(--muted); }
  .connection { background: #e9f3f1; color: #265a52; padding: 5px 12px; border-radius: 20px; font-size: 11px; }
  .connection.error { background: #fff0e9; color: #803c20; }
  main { padding: 42px; max-width: 1300px; width: 100%; margin: 0 auto; }
  .eyebrow { color: var(--teal); font-size: 10px; font-weight: 700; letter-spacing: 2px; margin: 0 0 12px; }
  h1 { font-size: clamp(27px, 3.2vw, 40px); line-height: 1.2; letter-spacing: -1px; margin: 0 0 14px; font-weight: 650; }
  .intro { color: var(--muted); max-width: 660px; margin: 0 0 30px; }
  .notice { padding: 22px 26px; background: #e6f1ef; border-left: 3px solid var(--teal); border-radius: 0 8px 8px 0; margin: 0 0 34px; }
  .notice h2 { font-size: 15px; margin: 0 0 6px; }
  .notice p { font-size: 13px; color: #3a5d61; margin: 0; max-width: 760px; }
  .section-title { font-size: 16px; margin: 0 0 17px; }
  .module-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .module-card { padding: 25px; border: 1px solid var(--line); border-radius: 12px; background: #fff; display: flex; flex-direction: column; align-items: flex-start; }
  .module-card h3 { font-size: 17px; margin: 14px 0 5px; font-weight: 650; }
  .module-card p { font-size: 13px; color: var(--muted); margin: 0 0 22px; }
  .badge { font-size: 10px; letter-spacing: .4px; border-radius: 4px; padding: 3px 7px; background: #f0f4f4; color: #53696e; }
  .text-button { border: 0; background: none; color: var(--teal); padding: 3px 0; font-size: 12px; font-weight: 650; margin-top: auto; }
  .text-button:hover { text-decoration: underline; }
  .detail { padding: 30px; border: 1px solid var(--line); border-radius: 12px; background: white; }
  .detail h2 { font-size: 19px; margin: 0 0 12px; }
  .detail p { color: var(--muted); max-width: 720px; }
  .detail .text-button { margin-top: 16px; }
  .page-footer { margin-top: auto; padding: 24px 42px; font-size: 10px; color: var(--muted); }
  @media (min-width: 1500px) { .module-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 850px) {
    .app-shell { grid-template-columns: 1fr; }
    .sidebar { padding: 20px; }
    .brand { font-size: 22px; }
    .brand-symbol { height: 40px; width: 38px; }
    .nav-label, .sidebar-footer { display: none; }
    nav { display: flex; gap: 8px; overflow-x: auto; padding: 18px 4px 6px; }
    .nav-button { width: auto; white-space: nowrap; padding: 8px 12px; }
    .nav-number { display: none; }
    main { padding: 28px 22px; }
    .topbar { min-height: 60px; padding: 14px 22px; flex-wrap: wrap; }
    .page-footer { padding: 20px 22px; }
  }
  @media (max-width: 560px) {
    .module-grid { grid-template-columns: 1fr; }
    .module-card, .detail { padding: 22px; }
    .notice { padding: 18px; }
  }
</style>
